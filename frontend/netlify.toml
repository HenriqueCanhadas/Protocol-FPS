# netlify.toml — PROTOCOL FPS Frontend
# Hospedagem gratuita via Netlify (netlify.com)
#
# SETUP (5 minutos):
# 1. Faça push da pasta `frontend/` para um repositório GitHub
# 2. Acesse netlify.com → "Add new site" → "Import from Git"
# 3. Configure as Environment Variables no painel Netlify:
#      SUPABASE_URL       = https://xxxx.supabase.co
#      SUPABASE_ANON_KEY  = eyJhbGci...
# 4. Deploy automático a cada push no repositório
#
# Alternativas gratuitas (igualmente simples):
#   - Vercel (vercel.com)  → mesmo fluxo, mesmas env vars
#   - GitHub Pages         → use o script build.sh abaixo

[build]
  # Pasta raiz do frontend (ajuste se o repo tiver só a pasta frontend/)
  base    = "frontend"
  publish = "."
  command = "python build.py"

[build.environment]
  # Valores default (sobrescritos pelas env vars do painel Netlify)
  SUPABASE_URL      = ""
  SUPABASE_ANON_KEY = ""

[[redirects]]
  from   = "/"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/novo_produto"
  to     = "/novo_produto.html"
  status = 200

[[redirects]]
  from   = "/usuario"
  to     = "/usuario.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store"