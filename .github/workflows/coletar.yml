name: PROTOCOL FPS — Coleta diária

on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 horário de Brasília (UTC-3) = 12:00 UTC
  workflow_dispatch:        # permite rodar manualmente pelo GitHub
    inputs:
      item_id:
        description: "ID do item para coleta pontual (vazio = coleta todos os monitorados)"
        required: false
        default: ""

jobs:
  coletar:
    runs-on: ubuntu-latest

    steps:
      # checkout@v7 e setup-python@v6 já rodam em Node.js 24 nativamente —
      # dispensa a flag FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 usada com as versões antigas
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configura Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instala dependências Python
        run: pip install -r requirements.txt

      - name: Instala navegador Chromium do Playwright
        run: playwright install chromium --with-deps

      - name: Roda o scraper
        env:
          # Supabase
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Email
          EMAIL_REMETENTE:       ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA_APP:       ${{ secrets.EMAIL_SENHA_APP }}
          EMAIL_DESTINATARIO:    ${{ secrets.EMAIL_DESTINATARIO }}
          # Telegram
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          # GITHUB_ACTIONS já é setado automaticamente pelo runner
          # mas deixamos explícito para garantir que os scrapers detectem o CI
          GITHUB_ACTIONS:        "true"
          # ID do item para coleta pontual (vazio no cron/dispatch global = coleta todos)
          ITEM_ID:               ${{ github.event.inputs.item_id }}
        run: python main.py