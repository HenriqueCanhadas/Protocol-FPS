name: PROTOCOL FPS — Coleta diária

on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 horário de Brasília (UTC-3) = 12:00 UTC
  workflow_dispatch:        # permite rodar manualmente pelo GitHub

jobs:
  coletar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configura Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instala dependências Python
        run: pip install -r requirements.txt

      - name: Instala navegador Chromium do Playwright
        run: playwright install chromium --with-deps

      - name: Roda o scraper
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          EMAIL_REMETENTE:       ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA_APP:       ${{ secrets.EMAIL_SENHA_APP }}
          EMAIL_DESTINATARIO:    ${{ secrets.EMAIL_DESTINATARIO }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py