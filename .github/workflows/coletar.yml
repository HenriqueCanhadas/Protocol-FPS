name: PROTOCOL FPS — Coleta diária

on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 horário de Brasília (UTC-3) = 12:00 UTC
  workflow_dispatch:        # permite rodar manualmente pelo GitHub
    inputs:
      item_id:
        description: "ID do item para coleta pontual (vazio = coleta todos os monitorados)"
        required: false
        default: ""
      categoria:
        description: "Categoria para coleta segmentada — GPU/CPU/RAM/PSU/MOBO/STORAGE/DIVERSOS (vazio = todas)"
        required: false
        default: ""
      loja:
        description: "Loja para coleta segmentada — kabum/terabyteshop/pichau (vazio = todas)"
        required: false
        default: ""
      user_id:
        description: "UUID do usuário para coletar só os itens dele (vazio = todos os usuários)"
        required: false
        default: ""

jobs:
  coletar:
    runs-on: ubuntu-latest

    steps:
      # checkout@v7 e setup-python@v6 já rodam em Node.js 24 nativamente —
      # dispensa a flag FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 usada com as versões antigas
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configura Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instala dependências Python
        run: pip install -r requirements.txt

      - name: Instala navegador Chromium do Playwright
        run: playwright install chromium --with-deps

      - name: Roda o scraper
        env:
          # Supabase
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Email
          EMAIL_REMETENTE:       ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA_APP:       ${{ secrets.EMAIL_SENHA_APP }}
          EMAIL_DESTINATARIO:    ${{ secrets.EMAIL_DESTINATARIO }}
          # Telegram
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          # GITHUB_ACTIONS já é setado automaticamente pelo runner
          # mas deixamos explícito para garantir que os scrapers detectem o CI
          GITHUB_ACTIONS:        "true"
          # Escopo da coleta (vazios no cron/dispatch global = coleta todos):
          #   ITEM_ID   → coleta pontual de um produto (tem precedência)
          #   CATEGORIA → coleta segmentada por categoria (GPU/CPU/...)
          #   LOJA      → coleta segmentada por loja (kabum/terabyteshop/pichau)
          #   USER_ID   → coleta só os itens de um usuário (combinável c/ os acima)
          ITEM_ID:               ${{ github.event.inputs.item_id }}
          CATEGORIA:             ${{ github.event.inputs.categoria }}
          LOJA:                  ${{ github.event.inputs.loja }}
          USER_ID:               ${{ github.event.inputs.user_id }}
        run: python main.py